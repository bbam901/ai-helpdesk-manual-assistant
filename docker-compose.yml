services:
  db:
    image: postgres:16-alpine
    container_name: ai-helpdesk-db
    environment:
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: helpdesk
      POSTGRES_DB: helpdesk
    ports:
      - "5433:5432"
    volumes:
      - ai_helpdesk_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  ai-helpdesk:
    container_name: ai-helpdesk-app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://helpdesk:helpdesk@ai-helpdesk-db:5432/helpdesk?schema=public
      - MANUAL_UPLOADS_DIR=/app/uploads/manuals
    depends_on:
      - db
    volumes:
      - ai_helpdesk_manual_uploads:/app/uploads/manuals
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  ai_helpdesk_postgres_data:
  ai_helpdesk_manual_uploads:
